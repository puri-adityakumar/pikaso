<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pikaso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@800&family=Lora:ital,wght@0,400;1,400&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    // apply saved theme before first paint — light is the default
    try {
      var t = localStorage.getItem("pikaso-theme");
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
  <style>
    /* ── design tokens — shared with the landing page ─────────────────── */
    :root {
      --paper: #fbf9f4;
      --ink: #2b2a26;
      --muted: #84837b;
      --hairline: rgba(43, 42, 38, 0.08);
      --edge: rgba(43, 42, 38, 0.14);
      --dot: rgba(43, 42, 38, 0.16);
      --card: #ffffff;
      --field: #f4f2ea;
      --green: #62d96b;
      --green-soft: rgba(98, 217, 107, 0.18);
      --mint: #9fe7a4;
      --butter: #f8e9a9;
      --butter-deep: #f2cf62;
      --pink: #f4b8c0;
      --sky: #a9e8eb;
      --dark: #1d1c19;
      --dark-ink: #f4f2ea;
      --dark-edge: rgba(244, 242, 234, 0.14);
      --cta-ink: #1d1c19;       /* CTA text stays dark ink in both themes */
      --serif: "Lora", Georgia, "Times New Roman", serif;
      --sans: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
      --brand: "Epilogue", var(--sans);
      --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
      --ease: cubic-bezier(0.6, 0, 0, 1);
    }
    [data-theme="dark"] {
      --paper: #1d1c19;
      --ink: #f4f2ea;
      --muted: rgba(244, 242, 234, 0.55);
      --hairline: rgba(244, 242, 234, 0.1);
      --edge: rgba(244, 242, 234, 0.16);
      --dot: rgba(244, 242, 234, 0.13);
      --card: #24231e;
      --field: #2b2a25;
      --dark: #f4f2ea;          /* "dark cards" invert: toast becomes light */
      --dark-ink: #1d1c19;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
    }

    /* ── Top bar — sticky translucent, like the landing nav ───────────── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 100;
      user-select: none;
    }
    #top-bar .brand {
      font-family: var(--brand);
      font-weight: 800;
      font-size: 16px;
      color: var(--ink);
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    #top-bar .brand::before {
      content: '';
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: inset -2px -3px 4px rgba(0,0,0,0.22), inset 2px 3px 4px rgba(255,255,255,0.5);
    }
    #top-bar .sep { color: var(--edge); font-size: 18px; line-height: 1; }
    #top-bar .board-name {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    #top-bar .spacer { flex: 1; }
    #top-bar #bob-status {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    #top-bar #bob-status.active { color: var(--ink); }
    #top-bar #bob-status.active::before { content: '● '; color: var(--green); }

    #theme-toggle {
      width: 30px; height: 30px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s var(--ease), background 0.15s ease;
    }
    #theme-toggle:hover { transform: translateY(-1px); background: var(--field); }

    /* mode switch — Canvas | HTML segmented control */
    #mode-switch {
      display: flex;
      background: var(--field);
      border: 1px solid var(--edge);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .mode-btn {
      font: 700 12px/1 var(--sans);
      border: none;
      background: none;
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s var(--ease);
    }
    .mode-btn.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(43, 42, 38, 0.14);
    }

    /* ── HTML mode — the design sheet: normal scrolling page of mockups ── */
    body[data-mode="html"] { overflow-y: auto; }
    body[data-mode="html"] #board-root,
    body[data-mode="html"] #zoom-pill { display: none; }
    #sheet-view {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 76px 24px 120px;
    }
    body[data-mode="html"] #sheet-view { display: block; }
    .sheet-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 22px;
      color: var(--ink);
      margin: 0 0 4px;
    }
    .sheet-sub {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 28px;
    }
    .sheet-section {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(43, 42, 38, 0.1);
      margin: 0 0 36px;
      overflow: hidden;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--hairline);
    }
    .sheet-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex: none;
      box-shadow: inset -1px -2px 2px rgba(0, 0, 0, 0.22), inset 1px 2px 2px rgba(255, 255, 255, 0.5);
    }
    .sheet-name {
      font-family: var(--brand);
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .sheet-status {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--field);
      color: var(--muted);
    }
    .sheet-status.locked { background: var(--green-soft); color: var(--ink); }
    .sheet-count { font-size: 11.5px; font-weight: 800; color: var(--ink); }
    .sheet-count.zero { color: var(--muted); font-weight: 600; }
    .sheet-open {
      margin-left: auto;
      font: 600 11px/1 var(--mono);
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--edge);
      border-radius: 7px;
      padding: 5px 9px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .sheet-open:hover { color: var(--ink); border-color: var(--ink); }
    .sheet-stage {
      display: flex;
      justify-content: center;
      background: var(--field);
      padding: 20px;
      overflow: hidden;
    }
    .sheet-stage .frame-holder { position: relative; flex: none; }
    .sheet-stage iframe {
      display: block;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(43, 42, 38, 0.12);
    }
    .sheet-cap {
      padding: 10px 16px 12px;
      font: 600 11px/1.5 var(--mono);
      color: var(--muted);
    }
    .sheet-empty {
      border: 1px dashed var(--edge);
      border-radius: 14px;
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* new-frame strip */
    #new-frame-strip {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #new-frame-strip input {
      font: 600 13px/1 var(--sans);
      background: var(--card);
      border: 1px solid var(--edge);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      width: 240px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    #new-frame-strip input:focus { border-color: var(--ink); }
    #new-frame-strip input::placeholder { color: var(--muted); font-weight: 400; }
    #new-frame-btn {
      font: 700 13px/1 var(--sans);
      background: var(--green);
      color: var(--cta-ink);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s ease;
    }
    #new-frame-btn:hover {
      background: var(--mint);
      transform: translate(-1px, -1px);
      box-shadow: 3px 4px 0 -1px var(--green-soft);
    }
    #new-frame-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Board canvas ────────────────────────────────────────────────── */
    #board-root {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: grab;
    }
    #board-root.panning { cursor: grabbing; }

    /* dotted grid background — rendered via CSS, moves with the canvas */
    #board-root::before {
      content: '';
      position: absolute;
      inset: -9999px;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* ── Frame wrappers ──────────────────────────────────────────────── */
    .frame-wrapper {
      position: absolute;
    }
    .frame-label {
      position: absolute;
      top: -28px;
      left: 2px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      pointer-events: none;
      display: flex;
      align-items: baseline;
      gap: 7px;
    }
    .frame-label .frame-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      align-self: center;
      box-shadow: inset -1px -2px 2px rgba(0, 0, 0, 0.22), inset 1px 2px 2px rgba(255, 255, 255, 0.5);
    }
    .frame-label .frame-name {
      font-family: var(--brand);
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .frame-label .frame-status {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--field);
      color: var(--muted);
    }
    .frame-label .frame-status.locked {
      background: var(--green-soft);
      color: var(--ink);
    }
    .frame-label .ann-count {
      font-weight: 800;
      color: var(--ink);
    }
    .frame-label .ann-count.zero { color: var(--muted); font-weight: 600; }
    .frame-iframe {
      display: block;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 36px rgba(43, 42, 38, 0.1);
    }
    [data-theme="dark"] .frame-iframe { box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35); }

    /* ── Zoom pill ───────────────────────────────────────────────────── */
    #zoom-pill {
      position: fixed;
      bottom: 20px; left: 20px;
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 10px;
      padding: 4px 6px;
      z-index: 100;
      user-select: none;
      box-shadow: 0 10px 26px rgba(43, 42, 38, 0.08);
    }
    .zoom-btn {
      background: none;
      border: none;
      color: var(--ink);
      font-size: 15px;
      line-height: 1;
      width: 26px; height: 26px;
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease;
    }
    .zoom-btn:hover { background: var(--field); }
    #zoom-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      min-width: 42px;
      text-align: center;
    }

    /* ── Lock button — the butter CTA ────────────────────────────────── */
    #lock-btn {
      position: fixed;
      bottom: 20px; right: 20px;
      background: var(--butter-deep);
      border: none;
      border-radius: 9px;
      padding: 10px 18px;
      color: var(--cta-ink);
      font: 700 13px/1 var(--sans);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s ease;
    }
    #lock-btn:hover {
      background: var(--butter);
      transform: translate(-2px, -2px);
      box-shadow: 4px 5px 0 -1px rgba(43, 42, 38, 0.22);
    }

    /* ── Modal ───────────────────────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(43, 42, 38, 0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 30px 34px;
      min-width: 380px;
      max-width: 460px;
      box-shadow: 6px 8px 0 -1px var(--green-soft), 0 24px 60px rgba(43, 42, 38, 0.18);
    }
    #modal h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 20px;
      margin-bottom: 14px;
    }
    #modal .modal-stats {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    #modal .modal-note {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    #modal .modal-note code { font-family: var(--mono); font-size: 11px; }
    #modal .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .modal-btn {
      font: 700 13px/1 var(--sans);
      border-radius: 8px;
      padding: 8px 15px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s ease;
    }
    #modal-run-btn {
      background: var(--green);
      color: var(--cta-ink);
    }
    #modal-run-btn:hover { background: var(--mint); transform: translate(-1px, -1px); box-shadow: 3px 4px 0 -1px var(--green-soft); }
    #modal-copy-btn {
      background: var(--card);
      border-color: var(--edge);
      color: var(--ink);
    }
    #modal-copy-btn:hover { background: var(--field); }
    #modal-cancel-btn {
      background: none;
      color: var(--muted);
    }
    #modal-cancel-btn:hover { color: var(--ink); }

    /* ── Toast — the dark card ───────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 76px; left: 50%;
      transform: translateX(-50%);
      background: var(--dark);
      border: 1px solid var(--dark-edge);
      border-radius: 9px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dark-ink);
      z-index: 300;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      box-shadow: 0 16px 36px rgba(43, 42, 38, 0.18);
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div id="top-bar">
    <span class="brand">pikaso</span>
    <span class="sep">›</span>
    <span class="board-name" id="board-name">board</span>
    <span class="spacer"></span>
    <span id="bob-status">Bob: idle</span>
    <div id="mode-switch" role="group" aria-label="View mode">
      <button id="mode-canvas" class="mode-btn active" type="button">Canvas</button>
      <button id="mode-html" class="mode-btn" type="button">HTML</button>
    </div>
    <button id="theme-toggle" type="button" title="Toggle light / dark" aria-label="Toggle theme">☾</button>
    <div id="new-frame-strip">
      <input id="new-frame-input" type="text" placeholder="Describe the screen…" autocomplete="off">
      <button id="new-frame-btn">+ Generate mockup</button>
    </div>
  </div>

  <!-- Board canvas -->
  <div id="board-root">
    <div id="canvas"></div>
  </div>

  <!-- HTML mode: the design sheet — mockups stacked as a normal page -->
  <div id="sheet-view"></div>

  <!-- Zoom pill -->
  <div id="zoom-pill">
    <button class="zoom-btn" id="zoom-out">−</button>
    <span id="zoom-label">100%</span>
    <button class="zoom-btn" id="zoom-in">+</button>
  </div>

  <!-- Lock button -->
  <button id="lock-btn">Lock draft › implement</button>

  <!-- Lock modal -->
  <div id="modal-overlay">
    <div id="modal">
      <h2>Lock draft &amp; start implementation?</h2>
      <p class="modal-stats" id="modal-stats"></p>
      <p class="modal-note">Writes <code>.pikaso/DESIGN-SPEC.md</code></p>
      <div class="modal-actions">
        <button class="modal-btn" id="modal-run-btn">Run with Bob Shell</button>
        <button class="modal-btn" id="modal-copy-btn">Copy prompt</button>
        <button class="modal-btn" id="modal-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    // theme toggle — light default, persists across sessions
    (function () {
      var btn = document.getElementById("theme-toggle");
      // sync glyph with the theme the boot script applied
      if (document.documentElement.getAttribute("data-theme") === "dark") btn.textContent = "☀";
      btn.addEventListener("click", function () {
        var root = document.documentElement;
        var dark = root.getAttribute("data-theme") === "dark";
        if (dark) {
          root.removeAttribute("data-theme");
          this.textContent = "☾";
        } else {
          root.setAttribute("data-theme", "dark");
          this.textContent = "☀";
        }
        try { localStorage.setItem("pikaso-theme", dark ? "light" : "dark"); } catch (e) {}
      });
    })();
  </script>

  <script src="/board.js" type="module"></script>
</body>
</html>
