<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pikaso · end</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@800&family=Lora:wght@400;500&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf9f4; --ink:#2b2a26; --muted:#84837b; --green:#62d96b; --mint:#9fe7a4;
    --butter:#f8e9a9; --butter-deep:#f2cf62; --pink:#f4b8c0; --sky:#a9e8eb;
    --dark:#1d1c19; --dark-ink:#f4f2ea;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{position:relative;background:#fbf9f4;color:#2b2a26;font-family:'Manrope',sans-serif;
    display:flex;align-items:center;justify-content:center}

  .wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{animation:drop .55s cubic-bezier(.3,1.4,.4,1) both}
  @keyframes drop{from{opacity:0;transform:translateY(-34px)}to{opacity:1;transform:translateY(0)}}
  h1{margin-top:14px;font-family:'Epilogue',sans-serif;font-weight:800;font-size:96px;letter-spacing:-.035em;
    line-height:1;animation:slam .45s cubic-bezier(.2,.9,.3,1.18) .18s both}
  .npx{margin-top:36px;font-family:var(--mono);font-size:17px;background:#1d1c19;color:#f4f2ea;
    padding:13px 26px;border-radius:12px;animation:rise .45s ease .36s both}
  .gh{margin-top:18px;font-family:var(--mono);font-size:15px;color:#84837b;animation:rise .45s ease .48s both}
  @keyframes slam{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="logo" width="100" height="120" viewBox="0 0 100 120" fill="none" aria-hidden="true">
      <line x1="50" y1="60" x2="50" y2="106" stroke="#2b2a26" stroke-width="9" stroke-linecap="round"/>
      <circle cx="50" cy="38" r="30" fill="#62d96b"/>
    </svg>
    <h1>pikaso</h1>
    <div class="npx">npx pikaso</div>
    <div class="gh">github.com/puri-adityakumar/pikaso</div>
  </div>
</body>
</html>
